<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - Phobos Records</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/assets/shared.css">
    <style>
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .song-item {
            background-color: #181818;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .song-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .cover-art {
            flex-shrink: 0;
        }

        .cover-image {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
        }

        .song-number {
            font-size: 18px;
            font-weight: bold;
            color: #b3b3b3;
            min-width: 40px;
        }

        .song-info {
            flex-grow: 1;
        }

        .song-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .song-artist {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .song-details {
            color: #7a7a7a;
            font-size: 13px;
        }

        .song-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .streams,
        .likes {
            color: #b3b3b3;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo-section">
            <img src="/assets/phobos_logo.png" alt="Phobos Records Logo" class="logo">
            <div class="brand-name">Phobos Records</div>
        </div>
        <nav>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/artists">Artists</a></li>
                <li><a href="/works" class="active">Works</a></li>
                <li><a href="/analytics">Analytics</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Our Works</h1>
            <button id="toggleWorkFormBtn" class="toggle-form-btn">Add Work</button>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="workSearch" placeholder="Search title or artist..." style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;flex:1;min-width:200px;outline:none;">
            <select id="genreFilter" style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#b3b3b3;font-size:14px;outline:none;cursor:pointer;">
                <option value="">All Genres</option>
            </select>
        </div>

        <div class="songs-list" id="worksList">
                <!-- Works loaded dynamically from API -->
        </div>

        <template id="workItemTemplate">
            <div class="song-item">
                <div class="cover-art">
                    <img src="#" alt="" class="cover-image">
                </div>
                <div class="song-number"></div>
                <div class="song-info">
                    <h3 class="work-title"></h3>
                    <p class="song-artist"></p>
                    <p class="song-details"></p>
                </div>
                <div class="song-stats">
                    <span class="streams"></span>
                    <span class="likes"></span>
                </div>
            </div>
        </template>

        <div class="pagination" id="pagination"></div>
    </main>
    
    <!-- Modal Dialog for Adding Works -->
    <div id="workModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="form-title">Add New Work</h2>
                <button id="closeWorkModal" class="close-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="workForm">
                    <div class="form-group">
                        <label for="artistSelect">Artist *</label>
                        <select id="artistSelect" name="artistSelect" required>
                            <option value="">Select an artist...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="workTitle">Work Title *</label>
                        <input type="text" id="workTitle" name="workTitle" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="genre">Genre(s)</label>
                            <input type="text" id="genre" name="genre" placeholder="e.g. Techno, House">
                        </div>
                        <div class="form-group">
                            <label for="releaseDate">Release Date</label>
                            <input type="date" id="releaseDate" name="releaseDate">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="duration">Duration (s)</label>
                            <input type="number" id="duration" name="duration" min="0">
                        </div>
                        <div class="form-group">
                            <label for="bpm">BPM</label>
                            <input type="number" id="bpm" name="bpm" min="0">
                        </div>
                        <div class="form-group">
                            <label for="musicalKey">Key</label>
                            <input type="text" id="musicalKey" name="musicalKey" placeholder="e.g. Am">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="iswc">ISWC</label>
                        <input type="text" id="iswc" name="iswc" placeholder="T-000.000.000-0">
                    </div>

                    <div class="form-group">
                        <label for="workCover">Cover Art</label>
                        <input type="file" id="workCover" name="workCover" accept="image/png,image/jpeg,image/webp">
                        <div class="image-preview" id="workCoverPreview">
                            <span class="image-preview-placeholder">No image selected</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Add Work</button>
                        <button type="button" id="cancelWorkFormBtn" class="reset-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/assets/shared.js"></script>
    <script>
        // Generate random color
        function getRandomColor() {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        let allWorks = [];

        function renderWorks(works) {
            const list = document.getElementById('worksList');
            const template = document.getElementById('workItemTemplate');
            list.innerHTML = '';
            works.forEach((work, index) => {
                const clone = template.content.cloneNode(true);
                const img = clone.querySelector('img');
                clone.querySelector('.work-title').textContent = work.title;
                clone.querySelector('.song-number').textContent = String(index + 1).padStart(2, '0');
                clone.querySelector('.song-artist').textContent = work.artist_name || 'Unknown';
                clone.querySelector('.song-details').textContent =
                    `${(work.genre || ['Unknown'])[0]} • ${work.duration || 0}s • ${work.bpm || 0} BPM`;
                clone.querySelector('.streams').textContent = `${work.bpm || 0} BPM`;
                clone.querySelector('.likes').textContent = `Key: ${work.key || 'N/A'}`;
                const imageId = index + 1;
                img.onload = () => { img.style.display = 'block'; clone.querySelector('.cover-art').style.backgroundColor = 'transparent'; };
                img.onerror = () => {
                    img.style.display = 'none';
                    const div = clone.querySelector('.cover-art');
                    div.style.backgroundColor = getRandomColor();
                    div.style.width = '56px'; div.style.height = '56px';
                };
                img.src = `/assets/albums/${imageId}.png`;
                img.alt = work.title;
                list.appendChild(clone);
            });
        }

        function applyFilters() {
            const q = document.getElementById('workSearch').value.toLowerCase();
            const genre = document.getElementById('genreFilter').value;
            const filtered = allWorks.filter(w =>
                (!q || w.title.toLowerCase().includes(q) || (w.artist_name || '').toLowerCase().includes(q)) &&
                (!genre || (w.genre || []).includes(genre))
            );
            renderWorks(filtered);
        }

        async function loadWorks() {
            try {
                const CACHE_KEY = 'phobos_works';
                let data;
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    data = JSON.parse(cached);
                } else {
                    const res = await fetch('/api/works');
                    data = await res.json();
                    sessionStorage.setItem(CACHE_KEY, JSON.stringify(data));
                }
                allWorks = data.works;

                // Populate genre filter
                const genres = [...new Set(allWorks.flatMap(w => w.genre || []).filter(Boolean))].sort();
                const select = document.getElementById('genreFilter');
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g; opt.textContent = g;
                    select.appendChild(opt);
                });

                renderWorks(allWorks);

                document.getElementById('workSearch').addEventListener('input', applyFilters);
                document.getElementById('genreFilter').addEventListener('change', applyFilters);
            } catch (error) {
                console.error('Error loading works:', error);
            }
        }

        // Load artist dropdown dynamically
        async function loadArtistSelect() {
            const res = await fetch('/api/artists');
            const data = await res.json();
            const select = document.getElementById('artistSelect');
            select.innerHTML = '<option value="">Select an artist...</option>';
            data.artists.forEach(artist => {
                const opt = document.createElement('option');
                opt.value = artist.artist_id;
                opt.textContent = artist.artist_name;
                select.appendChild(opt);
            });
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadWorks();
            loadArtistSelect();
        });

        // Setup modal
        setupModal('workModal', 'toggleWorkFormBtn', 'closeWorkModal', 'cancelWorkFormBtn');

        // Cover art preview
        document.getElementById('workCover').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('workCoverPreview');
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    preview.innerHTML = `<img src="${ev.target.result}" style="border-radius:4px;width:100px;height:100px;object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '<span class="image-preview-placeholder">No image selected</span>';
            }
        });

        // Form submission handling
        document.getElementById('workForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            let coverName = '';
            const coverFile = document.getElementById('workCover').files[0];
            if (coverFile) {
                const fd = new FormData();
                fd.append('file', coverFile);
                const uploadRes = await fetch('/api/upload/work-cover', { method: 'POST', body: fd });
                const uploadData = await uploadRes.json();
                coverName = uploadData.filename;
            }

            const genreRaw = document.getElementById('genre').value;
            const genres = genreRaw ? genreRaw.split(',').map(g => g.trim()).filter(Boolean) : [];

            const workData = {
                artist_id: parseInt(document.getElementById('artistSelect').value),
                title: document.getElementById('workTitle').value,
                genre: genres,
                release_date: document.getElementById('releaseDate').value || '',
                duration_seconds: parseInt(document.getElementById('duration').value) || 0,
                bpm: parseInt(document.getElementById('bpm').value) || 0,
                key: document.getElementById('musicalKey').value,
                iswc: document.getElementById('iswc').value,
                work_cover: coverName
            };

            try {
                const response = await fetch('/api/works', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(workData)
                });

                if (response.ok) {
                    const selectedArtist = document.querySelector(`#artistSelect option[value="${workData.artist_id}"]`).text;
                    alert(`Work "${workData.title}" added for ${selectedArtist} successfully!`);
                    this.reset();
                    document.getElementById('workCoverPreview').innerHTML = '<span class="image-preview-placeholder">No image selected</span>';
                    document.getElementById('workModal').style.display = 'none';
                    setTimeout(() => location.reload(), 500);
                } else {
                    alert('Error adding work');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
