<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - Phobos Records</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/assets/shared.css">
    <style>
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .song-item {
            background-color: #181818;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .song-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .cover-art {
            flex-shrink: 0;
        }

        .cover-image {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
        }

        .song-number {
            font-size: 18px;
            font-weight: bold;
            color: #b3b3b3;
            min-width: 40px;
        }

        .song-info {
            flex-grow: 1;
        }

        .song-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .song-artist {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .song-details {
            color: #7a7a7a;
            font-size: 13px;
        }

        .song-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .streams,
        .likes {
            color: #b3b3b3;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Our Works</h1>
            <button id="toggleWorkFormBtn" class="toggle-form-btn">Add Work</button>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="workSearch" placeholder="Search title or artist..." style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;flex:1;min-width:200px;outline:none;">
            <select id="genreFilter" style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#b3b3b3;font-size:14px;outline:none;cursor:pointer;">
                <option value="">All Genres</option>
            </select>
        </div>

        <div class="songs-list" id="worksList">
                <!-- Works loaded dynamically from API -->
        </div>

        <template id="workItemTemplate">
            <div class="song-item">
                <div class="cover-art">
                    <img src="#" alt="" class="cover-image">
                </div>
                <div class="song-number"></div>
                <div class="song-info">
                    <h3 class="work-title"></h3>
                    <p class="song-artist"></p>
                    <p class="song-details"></p>
                </div>
                <div class="song-stats">
                    <span class="streams"></span>
                    <span class="likes"></span>
                </div>
            </div>
        </template>

        <div class="pagination" id="pagination"></div>
    </main>
    
    <!-- Modal Dialog for Adding Works -->
    <div id="workModal" class="pm-overlay">
        <div class="pm-panel">
            <div class="pm-panel-header">
                <div>
                    <div class="pm-panel-title">New Work</div>
                    <div class="pm-panel-sub">Register a new release to the catalog</div>
                </div>
                <button id="closeWorkModal" class="pm-close" aria-label="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="workForm" class="pm-form">
                <!-- Cover drop zone -->
                <div class="pm-dropzone" id="workDropzone">
                    <div class="pm-dropzone-inner" id="workDropzoneInner">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        <span class="pm-dropzone-label">Drop cover or <label for="workCover" class="pm-dropzone-link">browse</label></span>
                    </div>
                    <input type="file" id="workCover" name="workCover" accept="image/png,image/jpeg,image/webp" style="display:none">
                </div>

                <div class="pm-row">
                    <div class="pm-field" style="flex:1.5">
                        <label class="pm-label" for="workTitle">Title <span class="pm-req">*</span></label>
                        <input class="pm-input" type="text" id="workTitle" name="workTitle" placeholder="e.g. Event Horizon" required>
                    </div>
                    <div class="pm-field" style="flex:1">
                        <label class="pm-label" for="artistSelect">Artist <span class="pm-req">*</span></label>
                        <select class="pm-input pm-select" id="artistSelect" name="artistSelect" required>
                            <option value="">Select...</option>
                        </select>
                    </div>
                </div>

                <div class="pm-row">
                    <div class="pm-field">
                        <label class="pm-label" for="genre">Genre(s)</label>
                        <input class="pm-input" type="text" id="genre" name="genre" placeholder="e.g. Techno, House">
                    </div>
                    <div class="pm-field">
                        <label class="pm-label" for="releaseDate">Release Date</label>
                        <input class="pm-input pm-date" type="date" id="releaseDate" name="releaseDate">
                    </div>
                </div>

                <div class="pm-row">
                    <div class="pm-field">
                        <label class="pm-label" for="duration">Duration (s)</label>
                        <input class="pm-input" type="number" id="duration" name="duration" min="0" placeholder="240">
                    </div>
                    <div class="pm-field">
                        <label class="pm-label" for="bpm">BPM</label>
                        <input class="pm-input" type="number" id="bpm" name="bpm" min="0" placeholder="128">
                    </div>
                    <div class="pm-field">
                        <label class="pm-label" for="musicalKey">Key</label>
                        <input class="pm-input" type="text" id="musicalKey" name="musicalKey" placeholder="e.g. Am">
                    </div>
                </div>

                <div class="pm-field">
                    <label class="pm-label" for="iswc">ISWC</label>
                    <input class="pm-input" type="text" id="iswc" name="iswc" placeholder="T-000.000.000-0">
                </div>

                <div class="pm-actions">
                    <button type="button" id="cancelWorkFormBtn" class="pm-btn-ghost">Cancel</button>
                    <button type="submit" class="pm-btn-primary">Add Work</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/assets/shared.js"></script>
    <script>
        // Generate random color
        function getRandomColor() {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        let allWorks = [];

        function renderWorks(works) {
            const list = document.getElementById('worksList');
            const template = document.getElementById('workItemTemplate');
            list.innerHTML = '';
            works.forEach((work, index) => {
                const clone = template.content.cloneNode(true);
                clone.querySelector('.work-title').textContent = work.title;
                clone.querySelector('.song-number').textContent = String(index + 1).padStart(2, '0');
                clone.querySelector('.song-artist').textContent = work.artist_name || 'Unknown';
                clone.querySelector('.song-details').textContent =
                    `${(work.genre || ['Unknown'])[0]} • ${work.duration || 0}s • ${work.bpm || 0} BPM`;
                clone.querySelector('.streams').textContent = `${work.bpm || 0} BPM`;
                clone.querySelector('.likes').textContent = `Key: ${work.key || 'N/A'}`;
                list.appendChild(clone);
                const item = list.lastElementChild;
                const img = item.querySelector('img');
                const coverDiv = item.querySelector('.cover-art');
                img.onload = () => { img.style.display = 'block'; coverDiv.style.backgroundColor = 'transparent'; };
                img.onerror = () => {
                    img.style.display = 'none';
                    coverDiv.style.backgroundColor = getRandomColor();
                    coverDiv.style.width = '56px'; coverDiv.style.height = '56px';
                };
                img.src = `/assets/albums/${index + 1}.png`;
                img.alt = work.title;
            });
        }

        function applyFilters() {
            const q = document.getElementById('workSearch').value.toLowerCase();
            const genre = document.getElementById('genreFilter').value;
            const filtered = allWorks.filter(w =>
                (!q || w.title.toLowerCase().includes(q) || (w.artist_name || '').toLowerCase().includes(q)) &&
                (!genre || (w.genre || []).includes(genre))
            );
            renderWorks(filtered);
        }

        async function loadWorks() {
            try {
                const CACHE_KEY = 'phobos_works';
                let data;
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    data = JSON.parse(cached);
                } else {
                    const res = await fetch('/api/works');
                    data = await res.json();
                    sessionStorage.setItem(CACHE_KEY, JSON.stringify(data));
                }
                allWorks = data.works;

                // Populate genre filter
                const genres = [...new Set(allWorks.flatMap(w => w.genre || []).filter(Boolean))].sort();
                const select = document.getElementById('genreFilter');
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g; opt.textContent = g;
                    select.appendChild(opt);
                });

                renderWorks(allWorks);

                document.getElementById('workSearch').addEventListener('input', applyFilters);
                document.getElementById('genreFilter').addEventListener('change', applyFilters);
            } catch (error) {
                console.error('Error loading works:', error);
            }
        }

        // Load artist dropdown dynamically
        async function loadArtistSelect() {
            const res = await fetch('/api/artists');
            const data = await res.json();
            const select = document.getElementById('artistSelect');
            select.innerHTML = '<option value="">Select an artist...</option>';
            data.artists.forEach(artist => {
                const opt = document.createElement('option');
                opt.value = artist.artist_id;
                opt.textContent = artist.artist_name;
                select.appendChild(opt);
            });
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadWorks();
            loadArtistSelect();
        });

        // Modal open/close
        const workModal = document.getElementById('workModal');
        const openWorkModal = () => workModal.classList.add('open');
        const closeWorkModal = () => workModal.classList.remove('open');
        document.getElementById('toggleWorkFormBtn').addEventListener('click', openWorkModal);
        document.getElementById('closeWorkModal').addEventListener('click', closeWorkModal);
        document.getElementById('cancelWorkFormBtn').addEventListener('click', closeWorkModal);
        workModal.addEventListener('click', e => { if (e.target === workModal) closeWorkModal(); });

        // Cover preview via dropzone
        const workDropzone = document.getElementById('workDropzone');
        const workDropzoneInner = document.getElementById('workDropzoneInner');
        const workCoverInput = document.getElementById('workCover');
        workDropzone.addEventListener('click', () => workCoverInput.click());
        workCoverInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                workDropzoneInner.innerHTML = `<img src="${ev.target.result}" style="width:100%;max-height:180px;object-fit:cover;border-radius:10px;display:block;">`;
                workDropzoneInner.classList.add('has-preview');
            };
            reader.readAsDataURL(file);
        });

        // Form submission
        document.getElementById('workForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = this.querySelector('.pm-btn-primary');
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            let coverName = '';
            const coverFile = workCoverInput.files[0];
            if (coverFile) {
                const fd = new FormData();
                fd.append('file', coverFile);
                const uploadRes = await fetch('/api/upload/work-cover', { method: 'POST', body: fd });
                const uploadData = await uploadRes.json();
                coverName = uploadData.filename;
            }

            const genreRaw = document.getElementById('genre').value;
            const genres = genreRaw ? genreRaw.split(',').map(g => g.trim()).filter(Boolean) : [];

            const workData = {
                artist_id: parseInt(document.getElementById('artistSelect').value),
                title: document.getElementById('workTitle').value,
                genre: genres,
                release_date: document.getElementById('releaseDate').value || '',
                duration_seconds: parseInt(document.getElementById('duration').value) || 0,
                bpm: parseInt(document.getElementById('bpm').value) || 0,
                key: document.getElementById('musicalKey').value,
                iswc: document.getElementById('iswc').value,
                work_cover: coverName
            };

            try {
                const response = await fetch('/api/works', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(workData)
                });
                if (response.ok) {
                    closeWorkModal();
                    sessionStorage.removeItem('phobos_works');
                    setTimeout(() => location.reload(), 200);
                } else {
                    submitBtn.textContent = 'Add Work';
                    submitBtn.disabled = false;
                    alert('Error adding work');
                }
            } catch (error) {
                submitBtn.textContent = 'Add Work';
                submitBtn.disabled = false;
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
