<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists - Phobos Records</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/assets/shared.css">
    <style>
        .artists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .artist-card {
            background-color: #181818;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #282828;
        }

        .artist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .artist-image {
            margin-bottom: 16px;
        }

        .artist-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
        }

        .artist-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .artist-genre {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .artist-stats {
            color: #ffffff;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .artist-description {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Our Artists</h1>
            <button id="toggleFormBtn" class="toggle-form-btn">Add Artist</button>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="artistSearch" placeholder="Search artist..." style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;flex:1;min-width:200px;outline:none;">
            <select id="genreFilter" style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#b3b3b3;font-size:14px;outline:none;cursor:pointer;">
                <option value="">All Genres</option>
            </select>
        </div>

        <div class="artists-grid" id="artistsGrid">
                <!-- Artists loaded dynamically from API -->
        </div>

        <template id="artistCardTemplate">
            <div class="artist-card">
                <div class="artist-image">
                    <img src="#" alt="" class="artist-avatar">
                </div>
                <div class="artist-info">
                    <h3 class="artist-name"></h3>
                    <p class="artist-genre"></p>
                    <p class="artist-stats"></p>
                    <p class="artist-description"></p>
                </div>
            </div>
        </template>

        <div class="pagination" id="pagination"></div>
    </main>
    
    <!-- Modal Dialog -->
    <div id="artistModal" class="pm-overlay">
        <div class="pm-panel">
            <div class="pm-panel-header">
                <div>
                    <div class="pm-panel-title">New Artist</div>
                    <div class="pm-panel-sub">Add a new artist to the roster</div>
                </div>
                <button id="closeModal" class="pm-close" aria-label="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="artistForm" class="pm-form">
                <!-- Image drop zone -->
                <div class="pm-dropzone" id="artistDropzone">
                    <div class="pm-dropzone-inner" id="artistDropzoneInner">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        <span class="pm-dropzone-label">Drop photo or <label for="artistImage" class="pm-dropzone-link">browse</label></span>
                    </div>
                    <input type="file" id="artistImage" name="artistImage" accept="image/png,image/jpeg,image/webp" style="display:none">
                </div>

                <div class="pm-field">
                    <label class="pm-label" for="artistName">Artist Name <span class="pm-req">*</span></label>
                    <input class="pm-input" type="text" id="artistName" name="artistName" placeholder="e.g. Lyra Void" required>
                </div>

                <div class="pm-row">
                    <div class="pm-field">
                        <label class="pm-label" for="mainGenre">Genre <span class="pm-req">*</span></label>
                        <input class="pm-input" type="text" id="mainGenre" name="mainGenre" placeholder="e.g. Techno" required>
                    </div>
                    <div class="pm-field">
                        <label class="pm-label" for="workType">Work Type</label>
                        <select class="pm-input pm-select" id="workType" name="workType">
                            <option value="Album">Album</option>
                            <option value="Single">Single</option>
                            <option value="EP">EP</option>
                            <option value="Mixtape">Mixtape</option>
                        </select>
                    </div>
                </div>

                <div class="pm-row">
                    <div class="pm-field">
                        <label class="pm-label" for="royaltyPct">Royalty % <span class="pm-req">*</span></label>
                        <input class="pm-input" type="number" id="royaltyPct" name="royaltyPct" min="0" max="100" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="pm-field">
                        <label class="pm-label" for="advancedPaid">Advance Paid ($)</label>
                        <input class="pm-input" type="number" id="advancedPaid" name="advancedPaid" min="0" step="0.01" placeholder="0">
                    </div>
                    <div class="pm-field">
                        <label class="pm-label" for="advancePending">Advance Pending ($)</label>
                        <input class="pm-input" type="number" id="advancePending" name="advancePending" min="0" step="0.01" placeholder="0">
                    </div>
                </div>

                <label class="pm-toggle">
                    <input type="checkbox" id="isFrontArtist" name="isFrontArtist">
                    <span class="pm-toggle-track"><span class="pm-toggle-thumb"></span></span>
                    <span class="pm-toggle-label">Front Artist</span>
                </label>

                <div class="pm-actions">
                    <button type="button" id="cancelFormBtn" class="pm-btn-ghost">Cancel</button>
                    <button type="submit" class="pm-btn-primary">Add Artist</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/assets/shared.js"></script>
    <script>
        // Generate random color
        function getRandomColor() {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        let allArtists = [];
        let filteredArtists = [];
        let currentPage = 1;
        const PAGE_SIZE = 9;

        function renderArtists(artists) {
            const grid = document.getElementById('artistsGrid');
            const template = document.getElementById('artistCardTemplate');
            grid.innerHTML = '';
            const start = (currentPage - 1) * PAGE_SIZE;
            const page = artists.slice(start, start + PAGE_SIZE);
            page.forEach((artist, pageIdx) => {
                const clone = template.content.cloneNode(true);
                clone.querySelector('.artist-name').textContent = artist.artist_name;
                clone.querySelector('.artist-genre').textContent = artist.main_genre;
                clone.querySelector('.artist-stats').textContent = `Royalty: ${(artist.royalty_pct * 100).toFixed(1)}%`;
                clone.querySelector('.artist-description').textContent = artist.work_type;
                grid.appendChild(clone);
                const card = grid.lastElementChild;
                const img = card.querySelector('img');
                const imgWrap = card.querySelector('.artist-image');
                const localIdx = start + pageIdx + 1;
                img.onload = () => { img.style.display = 'block'; imgWrap.style.backgroundColor = 'transparent'; };
                img.onerror = () => {
                    img.style.display = 'none';
                    imgWrap.style.backgroundColor = getRandomColor();
                    imgWrap.style.width = '100px'; imgWrap.style.height = '100px'; imgWrap.style.borderRadius = '50%';
                };
                img.src = `/assets/artists/${localIdx}.png`;
                img.alt = artist.artist_name;
            });
            renderPagination(artists.length);
        }

        function renderPagination(total) {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(total / PAGE_SIZE);
            container.innerHTML = '';
            if (totalPages <= 1) return;

            const prev = document.createElement('button');
            prev.className = 'pagination-btn';
            prev.textContent = '← Prev';
            prev.disabled = currentPage === 1;
            prev.onclick = () => { currentPage--; renderArtists(filteredArtists); };
            container.appendChild(prev);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'pagination-btn' + (i === currentPage ? ' active' : '');
                btn.textContent = i;
                btn.onclick = () => { currentPage = i; renderArtists(filteredArtists); };
                container.appendChild(btn);
            }

            const next = document.createElement('button');
            next.className = 'pagination-btn';
            next.textContent = 'Next →';
            next.disabled = currentPage === totalPages;
            next.onclick = () => { currentPage++; renderArtists(filteredArtists); };
            container.appendChild(next);
        }

        function applyFilters() {
            const q = document.getElementById('artistSearch').value.toLowerCase();
            const genre = document.getElementById('genreFilter').value;
            filteredArtists = allArtists.filter(a =>
                (!q || a.artist_name.toLowerCase().includes(q)) &&
                (!genre || a.main_genre === genre)
            );
            currentPage = 1;
            renderArtists(filteredArtists);
        }

        async function loadArtists() {
            try {
                const CACHE_KEY = 'phobos_artists';
                let data;
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    data = JSON.parse(cached);
                } else {
                    const response = await fetch('/api/artists');
                    data = await response.json();
                    sessionStorage.setItem(CACHE_KEY, JSON.stringify(data));
                }
                allArtists = data.artists;

                // Populate genre filter
                const genres = [...new Set(allArtists.map(a => a.main_genre).filter(Boolean))].sort();
                const select = document.getElementById('genreFilter');
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g; opt.textContent = g;
                    select.appendChild(opt);
                });

                filteredArtists = allArtists;
                renderArtists(filteredArtists);

                document.getElementById('artistSearch').addEventListener('input', applyFilters);
                document.getElementById('genreFilter').addEventListener('change', applyFilters);
            } catch (error) {
                console.error('Error loading artists:', error);
            }
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadArtists);

        // Modal open/close
        const artistModal = document.getElementById('artistModal');
        const openModal = () => artistModal.classList.add('open');
        const closeArtistModal = () => artistModal.classList.remove('open');
        document.getElementById('toggleFormBtn').addEventListener('click', openModal);
        document.getElementById('closeModal').addEventListener('click', closeArtistModal);
        document.getElementById('cancelFormBtn').addEventListener('click', closeArtistModal);
        artistModal.addEventListener('click', e => { if (e.target === artistModal) closeArtistModal(); });

        // Image preview via dropzone
        const artistDropzone = document.getElementById('artistDropzone');
        const artistDropzoneInner = document.getElementById('artistDropzoneInner');
        const artistImageInput = document.getElementById('artistImage');
        artistDropzone.addEventListener('click', () => artistImageInput.click());
        artistImageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                artistDropzoneInner.innerHTML = `<img src="${ev.target.result}" style="width:100%;max-height:180px;object-fit:cover;border-radius:10px;display:block;">`;
                artistDropzoneInner.classList.add('has-preview');
            };
            reader.readAsDataURL(file);
        });

        // Form submission
        document.getElementById('artistForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = this.querySelector('.pm-btn-primary');
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            let imageName = '';
            const imageFile = artistImageInput.files[0];
            if (imageFile) {
                const fd = new FormData();
                fd.append('file', imageFile);
                const uploadRes = await fetch('/api/upload/artist-image', { method: 'POST', body: fd });
                const uploadData = await uploadRes.json();
                imageName = uploadData.filename;
            }

            const formData = {
                artist_name: document.getElementById('artistName').value,
                royalty_pct: parseFloat(document.getElementById('royaltyPct').value),
                advanced_paid: parseFloat(document.getElementById('advancedPaid').value) || 0,
                advance_pending: parseFloat(document.getElementById('advancePending').value) || 0,
                is_front_artist: document.getElementById('isFrontArtist').checked,
                main_genre: document.getElementById('mainGenre').value,
                work_type: document.getElementById('workType').value,
                artist_image: imageName
            };

            try {
                const response = await fetch('/api/artists', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                if (response.ok) {
                    closeArtistModal();
                    sessionStorage.removeItem('phobos_artists');
                    setTimeout(() => location.reload(), 200);
                } else {
                    submitBtn.textContent = 'Add Artist';
                    submitBtn.disabled = false;
                    alert('Error adding artist');
                }
            } catch (error) {
                submitBtn.textContent = 'Add Artist';
                submitBtn.disabled = false;
                alert('Error: ' + error.message);
            }
        });
    </script>
    
</body>
</html>
