<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists - Phobos Records</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/assets/shared.css">
    <style>
        .artists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .artist-card {
            background-color: #181818;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #282828;
        }

        .artist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .artist-image {
            margin-bottom: 16px;
        }

        .artist-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
        }

        .artist-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .artist-genre {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .artist-stats {
            color: #ffffff;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .artist-description {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo-section">
            <img src="/assets/phobos_logo.png" alt="Phobos Records Logo" class="logo">
            <div class="brand-name">Phobos Records</div>
        </div>
        <nav>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/artists" class="active">Artists</a></li>
                <li><a href="/works">Works</a></li>
                <li><a href="/analytics">Analytics</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Our Artists</h1>
            <button id="toggleFormBtn" class="toggle-form-btn">Add Artist</button>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="artistSearch" placeholder="Search artist..." style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;flex:1;min-width:200px;outline:none;">
            <select id="genreFilter" style="background:#181818;border:1px solid #333;border-radius:8px;padding:10px 16px;color:#b3b3b3;font-size:14px;outline:none;cursor:pointer;">
                <option value="">All Genres</option>
            </select>
        </div>

        <div class="artists-grid" id="artistsGrid">
                <!-- Artists loaded dynamically from API -->
        </div>

        <template id="artistCardTemplate">
            <div class="artist-card">
                <div class="artist-image">
                    <img src="#" alt="" class="artist-avatar">
                </div>
                <div class="artist-info">
                    <h3 class="artist-name"></h3>
                    <p class="artist-genre"></p>
                    <p class="artist-stats"></p>
                    <p class="artist-description"></p>
                </div>
            </div>
        </template>

        <div class="pagination">
            <button class="pagination-btn active">1</button>
            <button class="pagination-btn">2</button>
            <button class="pagination-btn">3</button>
            <button class="pagination-btn next">Next →</button>
        </div>
    </main>
    
    <!-- Modal Dialog -->
    <div id="artistModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="form-title">Add New Artist</h2>
                <button id="closeModal" class="close-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="artistForm">
                    <div class="form-group">
                        <label for="artistName">Artist Name *</label>
                        <input type="text" id="artistName" name="artistName" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="mainGenre">Main Genre *</label>
                            <input type="text" id="mainGenre" name="mainGenre" placeholder="e.g. Techno" required>
                        </div>
                        <div class="form-group">
                            <label for="workType">Work Type</label>
                            <select id="workType" name="workType">
                                <option value="Album">Album</option>
                                <option value="Single">Single</option>
                                <option value="EP">EP</option>
                                <option value="Mixtape">Mixtape</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="royaltyPct">Royalty (%) *</label>
                            <input type="number" id="royaltyPct" name="royaltyPct" min="0" max="100" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="advancedPaid">Advance Paid ($)</label>
                            <input type="number" id="advancedPaid" name="advancedPaid" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="advancePending">Advance Pending ($)</label>
                            <input type="number" id="advancePending" name="advancePending" min="0" step="0.01">
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="isFrontArtist" name="isFrontArtist">
                        <label for="isFrontArtist">Front Artist</label>
                    </div>

                    <div class="form-group">
                        <label for="artistImage">Artist Image</label>
                        <input type="file" id="artistImage" name="artistImage" accept="image/png,image/jpeg,image/webp">
                        <div class="image-preview" id="artistImagePreview">
                            <span class="image-preview-placeholder">No image selected</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Add Artist</button>
                        <button type="button" id="cancelFormBtn" class="reset-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/assets/shared.js"></script>
    <script>
        // Generate random color
        function getRandomColor() {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        let allArtists = [];

        function renderArtists(artists) {
            const grid = document.getElementById('artistsGrid');
            const template = document.getElementById('artistCardTemplate');
            grid.innerHTML = '';
            artists.forEach((artist, index) => {
                const clone = template.content.cloneNode(true);
                const img = clone.querySelector('img');
                clone.querySelector('.artist-name').textContent = artist.artist_name;
                clone.querySelector('.artist-genre').textContent = artist.main_genre;
                clone.querySelector('.artist-stats').textContent = `Royalty: ${(artist.royalty_pct * 100).toFixed(1)}%`;
                clone.querySelector('.artist-description').textContent = artist.work_type;
                const imageId = index + 1;
                img.onload = () => { img.style.display = 'block'; clone.querySelector('.artist-image').style.backgroundColor = 'transparent'; };
                img.onerror = () => {
                    img.style.display = 'none';
                    const div = clone.querySelector('.artist-image');
                    div.style.backgroundColor = getRandomColor();
                    div.style.width = '100px'; div.style.height = '100px'; div.style.borderRadius = '50%';
                };
                img.src = `/assets/artists/${imageId}.png`;
                img.alt = artist.artist_name;
                grid.appendChild(clone);
            });
        }

        function applyFilters() {
            const q = document.getElementById('artistSearch').value.toLowerCase();
            const genre = document.getElementById('genreFilter').value;
            const filtered = allArtists.filter(a =>
                (!q || a.artist_name.toLowerCase().includes(q)) &&
                (!genre || a.main_genre === genre)
            );
            renderArtists(filtered);
        }

        async function loadArtists() {
            try {
                const response = await fetch('/api/artists');
                const data = await response.json();
                allArtists = data.artists;

                // Populate genre filter
                const genres = [...new Set(allArtists.map(a => a.main_genre).filter(Boolean))].sort();
                const select = document.getElementById('genreFilter');
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g; opt.textContent = g;
                    select.appendChild(opt);
                });

                renderArtists(allArtists);

                document.getElementById('artistSearch').addEventListener('input', applyFilters);
                document.getElementById('genreFilter').addEventListener('change', applyFilters);
            } catch (error) {
                console.error('Error loading artists:', error);
            }
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadArtists);

        // Setup modal
        setupModal('artistModal', 'toggleFormBtn', 'closeModal', 'cancelFormBtn');

        // Image preview
        document.getElementById('artistImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('artistImagePreview');
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    preview.innerHTML = `<img src="${ev.target.result}" style="border-radius:50%;width:100px;height:100px;object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '<span class="image-preview-placeholder">No image selected</span>';
            }
        });

        // Form submission handling
        document.getElementById('artistForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            let imageName = '';
            const imageFile = document.getElementById('artistImage').files[0];
            if (imageFile) {
                const fd = new FormData();
                fd.append('file', imageFile);
                const uploadRes = await fetch('/api/upload/artist-image', { method: 'POST', body: fd });
                const uploadData = await uploadRes.json();
                imageName = uploadData.filename;
            }

            const formData = {
                artist_name: document.getElementById('artistName').value,
                royalty_pct: parseFloat(document.getElementById('royaltyPct').value),
                advanced_paid: parseFloat(document.getElementById('advancedPaid').value) || 0,
                advance_pending: parseFloat(document.getElementById('advancePending').value) || 0,
                is_front_artist: document.getElementById('isFrontArtist').checked,
                main_genre: document.getElementById('mainGenre').value,
                work_type: document.getElementById('workType').value,
                artist_image: imageName
            };

            try {
                const response = await fetch('/api/artists', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert(`Artist "${formData.artist_name}" added successfully!`);
                    this.reset();
                    document.getElementById('artistImagePreview').innerHTML = '<span class="image-preview-placeholder">No image selected</span>';
                    document.getElementById('artistModal').style.display = 'none';
                    setTimeout(() => location.reload(), 500);
                } else {
                    alert('Error adding artist');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
    
</body>
</html>
