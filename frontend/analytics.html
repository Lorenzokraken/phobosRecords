<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Phobos Records</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/assets/shared.css">
    <style>
        .analytics {
            padding: 32px 48px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b3b3b3;
            margin-bottom: 16px;
        }
        .chart-card {
            background-color: #181818;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #282828;
        }
        .chart-card h2 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 18px;
        }
        @media (max-width: 768px) {
            .analytics { padding: 24px 16px; }
            .chart-row-2col, .chart-row-3col { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo-section">
            <img src="/assets/phobos_logo.png" alt="Phobos Records Logo" class="logo">
            <div class="brand-name">Phobos Records</div>
        </div>
        <nav>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/artists">Artists</a></li>
                <li><a href="/works">Works</a></li>
                <li><a href="/analytics" class="active">Analytics</a></li>
            </ul>
        </nav>
    </header>

    <div class="analytics">
        <p class="section-title">Click on a genre in the donut chart to filter all charts</p>

        <!-- Row 1: Sales by Artist + Genre Donut -->
        <div class="chart-row-3col" style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 24px;">
            <div class="chart-card">
                <h2>Sales by Artist</h2>
                <div style="position: relative; height: 400px; overflow-x: auto;">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Music Genres</h2>
                <div style="position: relative; height: 400px; display: flex; justify-content: center; align-items: center;">
                    <canvas id="genreChart" style="max-width: 100%; cursor: pointer;"></canvas>
                </div>
            </div>
        </div>

        <!-- Row 2: Platform + Top Works -->
        <div class="chart-row-2col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
            <div class="chart-card">
                <h2>Revenue by Platform</h2>
                <div style="position: relative; height: 300px;">
                    <canvas id="platformChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Top 5 Works</h2>
                <div style="position: relative; height: 300px;">
                    <canvas id="topWorksChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Row 3: Monthly Trend + Revenue by Genre -->
        <div class="chart-row-3col" style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 40px;">
            <div class="chart-card">
                <h2>Monthly Revenue Trend</h2>
                <div style="position: relative; height: 300px;">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Revenue by Genre</h2>
                <div style="position: relative; height: 300px;">
                    <canvas id="genreFunnelChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let salesChartInstance = null;
        let genreChartInstance = null;
        let platformChartInstance = null;
        let topWorksChartInstance = null;
        let trendChartInstance = null;
        let currentSelectedGenre = null;

        async function loadAnalytics() {
            try {
                const CACHE_KEY = 'phobos_analytics';
                let artistsData, revenueMonthData, platformData, platformDetailData, topWorksData, trendData, genreFunnelData;
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    ({ artistsData, revenueMonthData, platformData, platformDetailData, topWorksData, trendData, genreFunnelData } = JSON.parse(cached));
                } else {
                    const [artistsRes, revenueMonthRes, platformRes, platformDetailRes, topWorksRes, trendRes, genreFunnelRes] = await Promise.all([
                        fetch('/api/artists'),
                        fetch('/api/revenue/by-artist-month'),
                        fetch('/revenue_by_platform'),
                        fetch('/revenue_by_platform_detail'),
                        fetch('/top_works?limit=5'),
                        fetch('/monthly_trend'),
                        fetch('/revenue_by_genre')
                    ]);
                    artistsData = await artistsRes.json();
                    revenueMonthData = await revenueMonthRes.json();
                    platformData = await platformRes.json();
                    platformDetailData = await platformDetailRes.json();
                    topWorksData = await topWorksRes.json();
                    trendData = await trendRes.json();
                    genreFunnelData = await genreFunnelRes.json();
                    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ artistsData, revenueMonthData, platformData, platformDetailData, topWorksData, trendData, genreFunnelData }));
                }

                const artists = artistsData.artists;
                const revenueByMonth = revenueMonthData.revenues;

                const genreToArtists = {};
                artists.forEach(artist => {
                    const genre = artist.main_genre || 'Unknown';
                    if (!genreToArtists[genre]) genreToArtists[genre] = new Set();
                    genreToArtists[genre].add(artist.artist_name);
                });

                // --- Sales by Artist (Line) ---
                const artistColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2', '#FF6B9D', '#C44569', '#FFA502', '#FFE66D', '#95E1D3', '#F38181'];
                const allMonths = new Set();
                revenueByMonth.forEach(item => { if (item.month) allMonths.add(item.month); });
                const sortedMonths = Array.from(allMonths).sort();

                const revenueByArtistMonth = {};
                artists.forEach(artist => {
                    revenueByArtistMonth[artist.artist_name] = {};
                    sortedMonths.forEach(month => { revenueByArtistMonth[artist.artist_name][month] = 0; });
                });
                revenueByMonth.forEach(item => {
                    if (revenueByArtistMonth[item.artist_name]) {
                        revenueByArtistMonth[item.artist_name][item.month] = item.revenue;
                    }
                });

                const datasets = artists.map((artist, idx) => {
                    const data = sortedMonths.map(month => Math.sqrt(revenueByArtistMonth[artist.artist_name][month] || 0));
                    return {
                        label: artist.artist_name,
                        data,
                        borderColor: artistColors[idx % artistColors.length],
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.4,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        pointBackgroundColor: artistColors[idx % artistColors.length]
                    };
                }).filter(d => d.data.some(v => v > 0));

                const originalColors = {};
                datasets.forEach(d => { originalColors[d.label] = d.borderColor; });

                function filterAllCharts(genre) {
                    const artistsInGenre = genreToArtists[genre] || new Set();

                    salesChartInstance.data.datasets.forEach(d => {
                        const isMatch = artistsInGenre.has(d.label);
                        d.borderColor = isMatch ? originalColors[d.label] : 'rgba(255,255,255,0.08)';
                        d.pointBackgroundColor = isMatch ? originalColors[d.label] : 'rgba(255,255,255,0.08)';
                        d.borderWidth = isMatch ? 3 : 1;
                    });
                    salesChartInstance.update();

                    if (platformChartInstance) {
                        const filteredPlatforms = {};
                        platformDetailData.detail.forEach(row => {
                            if (artistsInGenre.has(row.artist_name))
                                filteredPlatforms[row.platform] = (filteredPlatforms[row.platform] || 0) + row.revenue;
                        });
                        platformChartInstance.data.datasets[0].data = platformData.platforms.map(p => filteredPlatforms[p.platform] || 0);
                        platformChartInstance.update();
                    }

                    if (topWorksChartInstance) {
                        topWorksChartInstance.data.datasets[0].backgroundColor = topWorksData.works.map(w =>
                            artistsInGenre.has(w.artist_name) ? '#4ECDC4' : 'rgba(78,205,196,0.15)'
                        );
                        topWorksChartInstance.update();
                    }

                    if (trendChartInstance) {
                        const filteredTrend = {};
                        revenueByMonth.forEach(item => {
                            if (artistsInGenre.has(item.artist_name) && item.month)
                                filteredTrend[item.month] = (filteredTrend[item.month] || 0) + item.revenue;
                        });
                        trendChartInstance.data.datasets[0].data = trendData.trend.map(t => filteredTrend[t.month] || 0);
                        trendChartInstance.update();
                    }
                }

                function resetAllCharts() {
                    salesChartInstance.data.datasets.forEach(d => {
                        d.borderColor = originalColors[d.label];
                        d.pointBackgroundColor = originalColors[d.label];
                        d.borderWidth = 2;
                    });
                    salesChartInstance.update();
                    if (platformChartInstance) {
                        platformChartInstance.data.datasets[0].data = platformData.platforms.map(p => p.revenue);
                        platformChartInstance.update();
                    }
                    if (topWorksChartInstance) {
                        topWorksChartInstance.data.datasets[0].backgroundColor = topWorksData.works.map(() => '#4ECDC4');
                        topWorksChartInstance.update();
                    }
                    if (trendChartInstance) {
                        trendChartInstance.data.datasets[0].data = trendData.trend.map(t => t.revenue);
                        trendChartInstance.update();
                    }
                }

                const chartCanvas = document.getElementById('salesChart');
                if (chartCanvas && sortedMonths.length > 0) {
                    salesChartInstance = new Chart(chartCanvas, {
                        type: 'line',
                        data: { labels: sortedMonths, datasets },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: true, position: 'bottom', labels: { color: '#b3b3b3', usePointStyle: true, padding: 15 } } },
                            scales: {
                                y: { beginAtZero: true, ticks: { color: '#b3b3b3' }, grid: { color: '#282828' }, title: { display: true, text: 'Revenue' } },
                                x: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } }
                            }
                        }
                    });
                }

                // --- Genre Donut ---
                const genreCount = {};
                artists.forEach(artist => {
                    const genre = artist.main_genre || 'Unknown';
                    genreCount[genre] = (genreCount[genre] || 0) + 1;
                });
                const genres = Object.entries(genreCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
                const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
                const originalGenreColors = colors.slice(0, genres.length);

                const genreCanvas = document.getElementById('genreChart');
                if (genreCanvas && genres.length > 0) {
                    genreChartInstance = new Chart(genreCanvas, {
                        type: 'doughnut',
                        data: {
                            labels: genres.map(g => g[0]),
                            datasets: [{ data: genres.map(g => g[1]), backgroundColor: colors.slice(0, genres.length), borderColor: '#181818', borderWidth: 2 }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            onClick: (event, elements) => {
                                if (!elements.length) return;
                                const clickedIndex = elements[0].index;
                                const selectedGenre = genres[clickedIndex][0];
                                if (currentSelectedGenre === selectedGenre) {
                                    currentSelectedGenre = null;
                                    resetAllCharts();
                                    genreChartInstance.data.datasets[0].backgroundColor = originalGenreColors;
                                } else {
                                    currentSelectedGenre = selectedGenre;
                                    filterAllCharts(selectedGenre);
                                    genreChartInstance.data.datasets[0].backgroundColor = genres.map((_, i) =>
                                        i === clickedIndex ? originalGenreColors[i] : 'rgba(128,128,128,0.2)'
                                    );
                                }
                                genreChartInstance.update();
                            },
                            plugins: { legend: { position: 'right', labels: { color: '#b3b3b3', font: { size: 12 }, padding: 15 } } }
                        }
                    });
                }

                // --- Platform Bar ---
                const platformCanvas = document.getElementById('platformChart');
                if (platformCanvas && platformData.platforms?.length) {
                    platformChartInstance = new Chart(platformCanvas, {
                        type: 'bar',
                        data: {
                            labels: platformData.platforms.map(p => p.platform),
                            datasets: [{ label: 'Revenue ($)', data: platformData.platforms.map(p => p.revenue), backgroundColor: ['#1DB954', '#FF6B6B', '#4ECDC4', '#FFA07A', '#BB8FCE', '#F7DC6F', '#85C1E2', '#FF6B9D'], borderRadius: 6 }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } }, x: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } } }
                        }
                    });
                }

                // --- Top 5 Works ---
                const topWorksCanvas = document.getElementById('topWorksChart');
                if (topWorksCanvas && topWorksData.works?.length) {
                    topWorksChartInstance = new Chart(topWorksCanvas, {
                        type: 'bar',
                        data: {
                            labels: topWorksData.works.map(w => w.title),
                            datasets: [{ label: 'Revenue ($)', data: topWorksData.works.map(w => w.gross_revenue), backgroundColor: '#4ECDC4', borderRadius: 6 }]
                        },
                        options: {
                            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } }, x: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } } }
                        }
                    });
                }

                // --- Monthly Trend ---
                const trendCanvas = document.getElementById('trendChart');
                if (trendCanvas && trendData.trend?.length) {
                    trendChartInstance = new Chart(trendCanvas, {
                        type: 'line',
                        data: {
                            labels: trendData.trend.map(t => t.month),
                            datasets: [{ label: 'Revenue ($)', data: trendData.trend.map(t => t.revenue), borderColor: '#FF6B6B', backgroundColor: 'rgba(255,107,107,0.15)', fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: '#FF6B6B' }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { callbacks: { afterLabel: (ctx) => { const g = trendData.trend[ctx.dataIndex].growth_pct; return g !== null ? `Growth: ${g > 0 ? '+' : ''}${g}%` : ''; } } } },
                            scales: { y: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } }, x: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } } }
                        }
                    });
                }

                // --- Revenue by Genre ---
                const genreFunnelCanvas = document.getElementById('genreFunnelChart');
                if (genreFunnelCanvas && genreFunnelData.genres?.length) {
                    const topGenres = genreFunnelData.genres.slice(0, 8);
                    new Chart(genreFunnelCanvas, {
                        type: 'bar',
                        data: {
                            labels: topGenres.map(g => g.genre || 'Unknown'),
                            datasets: [{ label: 'Revenue ($)', data: topGenres.map(g => g.gross_revenue), backgroundColor: '#F7DC6F', borderRadius: 6 }]
                        },
                        options: {
                            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { ticks: { color: '#b3b3b3', font: { size: 11 } }, grid: { color: '#282828' } }, x: { ticks: { color: '#b3b3b3' }, grid: { color: '#282828' } } }
                        }
                    });
                }

            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadAnalytics);
    </script>
</body>
</html>
