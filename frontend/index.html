<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phobos Records</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/assets/shared.css">
    <style>
        body { background: #0a0a0a; }

        .dash {
            padding: 40px 48px 48px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header row */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 36px;
        }
        .dash-title {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #555;
        }
        .dash-date {
            font-size: 12px;
            color: #444;
            letter-spacing: 0.04em;
        }

        /* KPI grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 16px;
            padding: 28px 28px 24px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.2s;
            cursor: default;
            animation: fadeUp 0.5s ease both;
        }
        .kpi-card:hover {
            border-color: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .kpi-card:nth-child(1) { animation-delay: 0s; }
        .kpi-card:nth-child(2) { animation-delay: 0.08s; }
        .kpi-card:nth-child(3) { animation-delay: 0.16s; }

        .kpi-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #555;
            margin-bottom: 16px;
        }
        .kpi-value {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
            color: #fff;
            margin-bottom: 12px;
        }
        .kpi-sub {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #555;
        }
        .kpi-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }
        .kpi-badge.up {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }
        .kpi-badge.down {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }
        .kpi-badge.neutral {
            color: #888;
            background: rgba(136,136,136,0.1);
        }

        /* secondary info inside card */
        .kpi-detail {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #1e1e1e;
            font-size: 13px;
            color: #888;
        }
        .kpi-detail strong {
            color: #ccc;
            font-weight: 600;
        }

        /* Chart section */
        .chart-section {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 16px;
            padding: 28px;
            animation: fadeUp 0.5s ease 0.28s both;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
        }
        .chart-subtitle {
            font-size: 12px;
            color: #444;
            margin-top: 2px;
        }
        .chart-wrap {
            position: relative;
            height: 220px;
        }

        /* Featured Tracks */
        #playerSection {
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        #playerGrid {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
            align-items: start;
        }
        #trackListCard {
            background: #181818;
            border-radius: 16px;
            border: 1px solid #282828;
            overflow: hidden;
        }
        #trackList { display: flex; flex-direction: column; }
        .track-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #1e1e1e;
        }
        .track-row:last-child { border-bottom: none; }
        .track-row:hover { background: #1e1e1e; }
        .track-row.active { background: #222; }
        .track-num { font-size: 12px; color: #777; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
        .track-cover { width: 42px; height: 42px; border-radius: 6px; overflow: hidden; background: #282828; flex-shrink: 0; }
        .track-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .track-meta { flex: 1; min-width: 0; }
        .track-meta-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .track-meta-artist { font-size: 12px; color: #b3b3b3; }

        #nowPlayingCard {
            background: linear-gradient(160deg, #1e1e1e 0%, #141414 100%);
            border-radius: 16px;
            border: 1px solid rgba(255,215,0,0.12);
            padding: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #cardGlow {
            position: absolute; top: -60px; left: -60px;
            width: 220px; height: 220px; border-radius: 50%;
            background: rgba(255,215,0,0.06);
            filter: blur(50px); pointer-events: none;
        }
        #artworkWrap {
            width: 100%; aspect-ratio: 1;
            border-radius: 12px; overflow: hidden;
            background: #282828;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        #artworkWrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #trackInfo { position: relative; }
        #playerTitle { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        #playerArtist { font-size: 12px; color: #b3b3b3; }
        #progressWrap { position: relative; }
        #progressBar {
            width: 100%; height: 4px; cursor: pointer;
            background: linear-gradient(to right, #FFD700 0%, #333 0%);
            border-radius: 2px; outline: none;
            -webkit-appearance: none; appearance: none;
            accent-color: #FFD700;
        }
        #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #FFD700; cursor: pointer; }
        #progressBar::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #FFD700; border: none; cursor: pointer; }
        #timeRow { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: #777; }
        #controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
        .ctrl-btn {
            background: none; border: none; color: #b3b3b3; cursor: pointer;
            padding: 8px; border-radius: 50%; transition: color 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:hover { color: #fff; }
        .play-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: #FFD700; border: none; cursor: pointer; color: #000;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 16px rgba(255,215,0,0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .play-btn:hover { transform: scale(1.06); box-shadow: 0 0 24px rgba(255,215,0,0.5); }

        /* Skeleton */
        .skel {
            background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: 6px;
            color: transparent !important;
            user-select: none;
        }
        .skel * { visibility: hidden; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .dash { padding: 24px 16px 40px; }
            .kpi-grid { grid-template-columns: 1fr; gap: 12px; }
            .kpi-value { font-size: 2.2rem; }
            .chart-wrap { height: 180px; }
            #playerGrid { grid-template-columns: 1fr; }
            #trackListCard { margin-bottom: 80px; }
        }
    </style>
</head>
<body>
<div class="dash">
    <div class="dash-header">
        <div class="dash-title">Dashboard</div>
        <div class="dash-date" id="dashDate"></div>
    </div>

    <div class="kpi-grid">
        <!-- Revenue MTD -->
        <div class="kpi-card" id="cardMtd">
            <div class="kpi-label">Revenue MTD</div>
            <div class="kpi-value skel" id="mtdValue">$000K</div>
            <div class="kpi-sub">
                <span class="kpi-badge neutral skel" id="mtdBadge">+0.0%</span>
                <span id="mtdLabel">vs last month</span>
            </div>
        </div>

        <!-- Top Artist -->
        <div class="kpi-card" id="cardArtist">
            <div class="kpi-label">Top Artist — MTD</div>
            <div class="kpi-value skel" id="artistName" style="font-size:1.75rem;letter-spacing:-0.02em;">—</div>
            <div class="kpi-sub">
                <span class="kpi-badge neutral skel" id="artistRevenue">$0</span>
                <span id="artistGenre" style="color:#444">—</span>
            </div>
        </div>

        <!-- Top Work -->
        <div class="kpi-card" id="cardWork">
            <div class="kpi-label">Top Work — MTD</div>
            <div class="kpi-value skel" id="workTitle" style="font-size:1.6rem;letter-spacing:-0.02em;">—</div>
            <div class="kpi-sub">
                <span class="kpi-badge neutral skel" id="workRevenue">$0</span>
                <span id="workArtist" style="color:#444">—</span>
            </div>
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-section">
        <div class="chart-header">
            <div>
                <div class="chart-title">Monthly Revenue</div>
                <div class="chart-subtitle">Last 6 months</div>
            </div>
        </div>
        <div class="chart-wrap">
            <canvas id="trendChart"></canvas>
        </div>
    </div>
</div>

<script>
    document.getElementById('dashDate').textContent =
        new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    function fmt(n) {
        if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
        return '$' + Math.round(n).toLocaleString();
    }

    function unskel(el) {
        if (el) el.classList.remove('skel');
    }

    let trendChart = null;

    function renderChart(labels, values) {
        const ctx = document.getElementById('trendChart').getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 220);
        grad.addColorStop(0, 'rgba(255,215,0,0.18)');
        grad.addColorStop(1, 'rgba(255,215,0,0)');

        if (trendChart) trendChart.destroy();
        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    data: values,
                    borderColor: '#FFD700',
                    borderWidth: 2,
                    pointRadius: 4,
                    pointBackgroundColor: '#FFD700',
                    pointBorderColor: '#0a0a0a',
                    pointBorderWidth: 2,
                    fill: true,
                    backgroundColor: grad,
                    tension: 0.4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1a1a1a',
                        borderColor: '#2a2a2a',
                        borderWidth: 1,
                        titleColor: '#888',
                        bodyColor: '#fff',
                        bodyFont: { weight: '600', size: 14 },
                        callbacks: { label: ctx => ' ' + fmt(ctx.parsed.y) }
                    }
                },
                scales: {
                    x: {
                        grid: { color: '#1a1a1a' },
                        ticks: { color: '#555', font: { size: 11 } },
                        border: { display: false }
                    },
                    y: {
                        grid: { color: '#1a1a1a' },
                        ticks: {
                            color: '#555', font: { size: 11 },
                            callback: v => fmt(v)
                        },
                        border: { display: false }
                    }
                }
            }
        });
    }

    async function loadDashboard() {
        const CACHE_KEY = 'phobos_dash_v2';
        let d = null;
        const cached = sessionStorage.getItem(CACHE_KEY);
        if (cached) { try { d = JSON.parse(cached); } catch(_) {} }

        if (!d) {
            const [mtdRes, artistRes, workRes, trendRes] = await Promise.all([
                fetch('/api/revenue/mtd'),
                fetch('/api/top-artist-mtd'),
                fetch('/api/top-work'),
                fetch('/api/revenue/trend6m'),
            ]);
            d = {
                mtd:    await mtdRes.json(),
                artist: await artistRes.json(),
                work:   await workRes.json(),
                trend:  await trendRes.json(),
            };
            sessionStorage.setItem(CACHE_KEY, JSON.stringify(d));
        }

        // Revenue MTD
        const mtdEl = document.getElementById('mtdValue');
        mtdEl.textContent = fmt(d.mtd.value);
        unskel(mtdEl);

        const badge = document.getElementById('mtdBadge');
        const pct = d.mtd.vs_last_month_pct;
        if (pct !== null && pct !== undefined) {
            const up = pct >= 0;
            badge.textContent = (up ? '↑ ' : '↓ ') + Math.abs(pct).toFixed(1) + '%';
            badge.className = 'kpi-badge ' + (up ? 'up' : 'down');
        } else {
            badge.textContent = 'N/A';
            badge.className = 'kpi-badge neutral';
        }
        unskel(badge);
        if (d.mtd.month) document.getElementById('mtdLabel').textContent = d.mtd.month;

        // Top Artist
        const artistNameEl = document.getElementById('artistName');
        artistNameEl.textContent = d.artist.name || '—';
        unskel(artistNameEl);

        const artistRevEl = document.getElementById('artistRevenue');
        artistRevEl.textContent = fmt(d.artist.revenue || 0);
        artistRevEl.className = 'kpi-badge neutral';
        unskel(artistRevEl);

        const artistGenreEl = document.getElementById('artistGenre');
        artistGenreEl.textContent = d.artist.genre || '—';

        // Top Work
        const workTitleEl = document.getElementById('workTitle');
        workTitleEl.textContent = d.work.title || '—';
        unskel(workTitleEl);

        const workRevEl = document.getElementById('workRevenue');
        workRevEl.textContent = fmt(d.work.revenue || 0);
        workRevEl.className = 'kpi-badge neutral';
        unskel(workRevEl);

        const workArtistEl = document.getElementById('workArtist');
        workArtistEl.textContent = d.work.artist || '—';

        // Chart
        const labels = d.trend.trend.map(t => t.month);
        const values = d.trend.trend.map(t => t.revenue);
        renderChart(labels, values);

        // Build track list
        buildTrackList();
        loadTrack(0);
        loadTrackDurations();
    }

    // Track data
    const tracks = [
        { title: 'Frozen Circuit', artist: 'Frost Byte', cover: '/assets/albums/3.png' },
        { title: 'Event Horizon',  artist: 'Lyra Void',  cover: '/assets/albums/1.png' },
        { title: 'Neon Pulse',     artist: 'Neon Pulse', cover: '/assets/albums/2.png' },
        { title: 'Digital Rush',   artist: 'Velocity',   cover: '/assets/albums/4.png' },
        { title: 'Neon Nights',    artist: 'Echo Waves', cover: '/assets/albums/5.png' },
    ];

    let currentTrack = 0;

    function buildTrackList() {
        const list = document.getElementById('trackList');
        tracks.forEach((t, i) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.innerHTML = `
                <span class="track-num">${String(i + 1).padStart(2, '0')}</span>
                <div class="track-cover"><img src="${t.cover}" alt=""></div>
                <div class="track-meta">
                    <div class="track-meta-title">${t.title}</div>
                    <div class="track-meta-artist">${t.artist}</div>
                </div>
                <span class="track-duration"></span>
            `;
            row.addEventListener('click', () => {
                currentTrack = i;
                if (window.parent && window.parent.pbTogglePlay) {
                    window.parent.pbTogglePlay();
                }
                updateTrackList();
            });
            list.appendChild(row);
        });
    }

    function loadTrack(idx) {
        currentTrack = idx;
        const t = tracks[idx];
        document.getElementById('playerTitle').textContent = t.title;
        document.getElementById('playerArtist').textContent = t.artist;
        document.getElementById('playerCoverImg').src = t.cover;
        document.getElementById('progressBar').value = 0;
        document.getElementById('progressBar').style.background = 'linear-gradient(to right, #FFD700 0%, #333 0%)';
        document.getElementById('currentTime').textContent = '0:00';
        document.getElementById('duration').textContent = '0:00';
        updateTrackList();
    }

    function updateTrackList() {
        document.querySelectorAll('.track-row').forEach((row, i) => {
            row.classList.toggle('active', i === currentTrack);
            row.querySelector('.track-num').innerHTML =
                (i === currentTrack && window.parent && window.parent.pbIsPlaying)
                    ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="#FFD700"><path d="M8 5v14l11-7z"/></svg>'
                    : String(i + 1).padStart(2, '0');
        });
    }

    function loadTrackDurations() {
        tracks.forEach((t, i) => {
            const a = new Audio();
            a.src = `/assets/audio/${t.title}.mp3`;
            a.addEventListener('loadedmetadata', () => {
                const rows = document.querySelectorAll('.track-row');
                if (rows[i]) {
                    const span = rows[i].querySelector('.track-duration');
                    if (span) span.textContent = formatTime(a.duration);
                }
            });
        });
    }

    function formatTime(s) {
        if (!s || isNaN(s) || !isFinite(s) || s < 0) return '0:00';
        return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    const parentFrame = window.parent;

    document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
