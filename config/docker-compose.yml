version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phobos_records_db
    environment:
      POSTGRES_DB: phobos_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: airvana
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phobos_network

volumes:
  postgres_data:

networks:
  phobos_network:
    driver: bridge
